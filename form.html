<div class="bar"><b>🏗️ Projects</b><button onclick="var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('pj_theme',t)}catch(e){}">🌓 Theme</button></div>

<script>
const PJ=(function(){
'use strict';
const LS_S='pj_settings_v1',LS_D='pj_data_v1',LS_N='pj_snap_v1';
const COLS=['Projects','BudgetLines','Funding','Ledger','Labour','Materials','Milestones','Documents','Revenue','Progress'];
const CATS=['Labour','Construction materials','Equipment','Professional services','Other / contingency','Purchase payments'];
const STATUS=['Pending Approval','Approved','Paid','Partially Paid','Rejected','Cancelled'];
const COUNTED=['Approved','Paid','Partially Paid'];
const PTYPES=[['personal','Personal / Non-revenue'],['income','Income-generating'],['purchase','Purchase of an appreciating asset (e.g. a unit bought off-plan)']];
const typeLabel=p=>p.type==='income'?'Income-generating':p.type==='purchase'?'Purchase (appreciating price)':'Personal / Non-revenue';
const PSTAT=['Planning','Active','On hold','Completed','Archived'];
const OPEN=['Planning','Active','On hold'];
let db={},settings={url:'',token:'',actor:''},snap={},pending=[],logs=[],root=null,hooks={},F=null,busy=false;
let V={name:'list',filter:'Active',id:null,tab:'overview'};
let badge={t:'warn',m:'Not connected'};
COLS.forEach(c=>db[c]=[]);
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0;};
const kes=n=>(num(n)<0?'−':'')+'KES '+Math.round(Math.abs(num(n))).toLocaleString('en-KE');
const cmp=n=>{n=num(n);const a=Math.abs(n),s=n<0?'−':'';return s+(a>=1e6?(a/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e3?Math.round(a/1e3)+'K':String(Math.round(a)));};
const pct=n=>(Math.round(num(n)*10)/10)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const rows=(c,pid)=>db[c].filter(r=>r.projectId===pid);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const dlabel=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}):'—';

/* ───────── entity definitions (drive every form) ───────── */
const ENT={
 Projects:{n:'project',f:[['name','Project name','text',1],['type','Project type','select',1,PTYPES],['status','Status','select',0,PSTAT],['location','Location','text'],['startDate','Start date','date'],['endDate','Target completion','date'],['approvedBudget','Approved budget (KES) — ignored for purchase projects','num'],['purchasePrice','PURCHASE: price at the start date (KES)','num'],['priceGrowth','PURCHASE: price growth (% per year)','num'],['growthComp','PURCHASE: growth compounding','select',0,[['monthly','Monthly'],['daily','Daily'],['annual','Annually'],['continuous','Continuous'],['simple','Simple (no compounding)']]],['priceStart','PURCHASE: price start date (when booking began)','date'],['depositPct','PURCHASE: deposit needed to secure the unit (% of price)','num'],['monthlyDeposit','PURCHASE: your planned monthly deposit (KES)','num'],['completionPct','Manual completion % (used when no milestones)','num'],['estimatedValue','Current estimated property value (KES)','num'],['linkedAsset','Linked asset (Wealth Registry)','asset'],['expectedMonthlyRevenue','Expected monthly revenue (KES) — income projects','num'],['totalUnits','Total units','num'],['occupiedUnits','Occupied / sold units','num'],['description','Description','area']]},
 BudgetLines:{n:'budget line',f:[['category','Category','select',1,CATS],['planned','Planned amount (KES)','num',1],['notes','Notes','text']]},
 Funding:{n:'funding record',f:[['source','Funding source (e.g. MMF withdrawal, monthly contribution, loan)','text',1],['committed','Amount committed (KES)','num'],['transferred','Amount transferred to project (KES)','num'],['txCost','Transaction cost (KES) — fee paid to send this money (not part of the amount)','num'],['date','Transfer date','date'],['reference','Reference','text'],['notes','Notes','text']]},
 Ledger:{n:'transaction',f:[['date','Date','date',1],['category','Category','select',1,CATS],['description','Description','text',1],['amount','Amount (KES)','num',1],['txCost','Transaction cost (KES) — fee for this payment (not part of the amount)','num'],['supplier','Supplier / recipient','text'],['payMethod','Payment method','select',0,['M-Pesa','Bank transfer','Cash','Cheque','Other']],['status','Payment status','select',1,STATUS],['amountPaid','Amount paid so far (KES)','num'],['receiptUrl','Receipt / invoice link','text'],['recordedBy','Recorded by','text']]},
 Labour:{n:'worker / contractor',f:[['worker','Worker / contractor','text',1],['workCat','Work category (e.g. masonry)','text'],['basis','Payment basis','select',1,['Daily','Weekly','Fixed contract']],['rate','Agreed rate (KES per day / week)','num'],['units','Days / weeks completed','num'],['contractValue','Contract value (KES) — fixed contracts','num'],['notes','Notes','text']]},
 Materials:{n:'material / equipment',f:[['item','Item','text',1],['kind','Type','select',1,['Consumable material','Purchased equipment','Rented equipment']],['qty','Quantity','num',1],['unit','Unit (bags, tonnes, days…)','text'],['unitCost','Unit cost (KES)','num',1],['txCost','Transaction cost (KES) — fee for this payment (not part of the amount)','num'],['supplier','Supplier','text'],['date','Date','date'],['delivery','Delivery status','select',0,['Ordered','Delivered','Returned']],['status','Payment status','select',1,STATUS],['amountPaid','Amount paid so far (KES)','num'],['registerAsAsset','Register as a family asset?','select',0,['No','Yes']]]},
 Milestones:{n:'milestone',f:[['title','Milestone (e.g. Foundation completed)','text',1],['plannedDate','Planned date','date'],['completedDate','Completed date','date'],['weight','Weight (% of the project)','num'],['status','Status','select',1,['Planned','In progress','Done']],['notes','Notes','text']]},
 Documents:{n:'document',f:[['docType','Type','select',1,['Invoice','Contract','Receipt','Approval','Plan / drawing','Permit','Other']],['title','Title','text',1],['url','Link (Google Drive etc.)','text'],['date','Date','date'],['notes','Notes','text']]},
 Progress:{n:'progress entry',f:[['date','Date recorded','date',1],['pct','Physical progress (% of the whole project complete)','num',1],['notes','Notes (what was observed on site)','text']]},
 Revenue:{n:'revenue / operating record',f:[['date','Date','date',1],['kind','Kind','select',1,['Revenue','Operating expense']],['description','Description','text'],['amount','Amount (KES)','num',1],['notes','Notes','text']]},
 LabourPay:{n:'labour payment',pseudo:1,f:[['date','Payment date','date',1],['amount','Amount paid (KES)','num',1],['txCost','Transaction cost (KES) — fee for this payment (not part of the amount)','num'],['payMethod','Payment method','select',0,['M-Pesa','Bank transfer','Cash','Cheque','Other']],['receiptUrl','Reference / receipt link','text']]}
};

/* ───────── storage ───────── */
function loadLocal(){
  try{const s=localStorage.getItem(LS_S);if(s)settings=Object.assign(settings,JSON.parse(s));}catch(e){}
  try{const d=JSON.parse(localStorage.getItem(LS_D)||'{}');COLS.forEach(c=>{if(Array.isArray(d[c]))db[c]=d[c];});}catch(e){}
  try{snap=JSON.parse(localStorage.getItem(LS_N)||'{}');}catch(e){snap={};}
}
function saveLocal(){try{localStorage.setItem(LS_D,JSON.stringify(db));}catch(e){}}
function saveSettings(){try{localStorage.setItem(LS_S,JSON.stringify(settings));}catch(e){}}
function saveSnap(cols){(cols||COLS).forEach(c=>{snap[c]=JSON.stringify(db[c]);});try{localStorage.setItem(LS_N,JSON.stringify(snap));}catch(e){}}

/* ───────── sync ───────── */
function setBadge(t,m){badge={t,m};const el=$('pj-badge');if(el&&el.lastChild){el.className='pj-sync '+t;el.lastChild.textContent=m;}}
async function readJson(res){const t=await res.text();try{return JSON.parse(t);}catch(e){throw new Error(/<html|<!doctype/i.test(t)?'got a web page instead of data — redeploy the Apps Script as a new version, access "Anyone"':'unreadable response');}}
async function pull(opts){
  opts=opts||{};
  if(!settings.url||!settings.token){setBadge('warn','Not connected');return false;}
  if(busy)return false;busy=true;setBadge('warn','Loading…');
  try{
    const sep=settings.url.indexOf('?')>-1?'&':'?';
    const res=await fetch(settings.url+sep+'token='+encodeURIComponent(settings.token)+'&_='+Date.now(),{method:'GET',cache:'no-store'});
    const j=await readJson(res);
    if(j.error)throw new Error(j.error==='unauthorized'?'token not accepted':j.error);
    const d=j.data||{};
    const sheetEmpty=COLS.every(c=>!Array.isArray(d[c])||!d[c].length);
    if(sheetEmpty&&COLS.some(c=>db[c].length)&&!opts.force){setBadge('warn','Sheet empty — local data kept');if(!opts.silent&&confirm('The Sheet is empty but this device holds projects. Upload them now?')){busy=false;await push(true);}return false;}
    COLS.forEach(c=>{if(Array.isArray(d[c]))db[c]=d[c].map(r=>Object.assign({},r));});
    logs=Array.isArray(d.Project_Log)?d.Project_Log:logs;
    saveLocal();saveSnap(COLS.filter(c=>Array.isArray(d[c])));
    setBadge('ok','Synced · '+new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}));
    render();return true;
  }catch(e){
    setBadge('err','Sync failed — using saved data');
    if(!opts.silent){
      let msg=e.message||String(e);
      if(e instanceof TypeError){
        let reach=true;try{await fetch(settings.url,{mode:'no-cors',cache:'no-store'});}catch(x){reach=false;}
        msg=reach?'Google answered, but with a web page instead of data. This usually means the Web App is not shared with “Anyone”, was never authorized (run testSetup once in the script editor and click Allow), was not redeployed as a NEW VERSION, or the script has an error. Press “Open test link” on this screen to see exactly which.'
                 :'That address could not be reached. Check it is the full Web App URL ending in /exec (not the Deployment ID alone) and that you are online.';
      }
      alert('Sync failed: '+msg);
    }
    return false;
  }
  finally{busy=false;}
}
async function push(all){
  saveLocal();
  if(!settings.url||!settings.token){setBadge('warn','Saved on this device only');return false;}
  setBadge('warn','Saving…');
  try{
    const changed=COLS.filter(c=>all||snap[c]===undefined||JSON.stringify(db[c])!==snap[c]);
    const payload={};changed.forEach(c=>{payload[c]=db[c];});
    if(pending.length)payload.auditEntries=pending;
    const f=new FormData();f.append('token',settings.token);f.append('actor',settings.actor||'unknown');f.append('data',JSON.stringify(payload));
    const res=await fetch(settings.url,{method:'POST',body:f});const j=await readJson(res);
    if(!j.ok)throw new Error(j.error==='unauthorized'?'token not accepted':(j.error||'Sheet error'));
    pending=[];saveSnap(changed);setBadge('ok','Saved · '+new Date().toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}));return true;
  }catch(e){setBadge('err','Save failed — kept on this device');return false;}
}
function log(action,pid,details){
  const e={id:uid(),timestamp:new Date().toISOString(),actor:settings.actor||'unknown',projectId:pid||'',action,details:details||''};
  pending.push(e);logs.push(e);
}
function commit(action,pid,details){log(action,pid,details);saveLocal();push();render();}

/* ───────── purchase calculator: a price that grows while you pay it off ───────── */
const GROW_LBL={monthly:'monthly',daily:'daily',annual:'annually',continuous:'continuously',simple:'simple (no compounding)'};
function growthFactor(rate,comp,d){const r=num(rate)/100;switch(comp){case 'daily':return Math.pow(1+r/365,d);case 'annual':return Math.pow(1+r,d/365);case 'continuous':return Math.exp(r*d/365);case 'simple':return 1+r*d/365;default:return Math.pow(1+r/12,d/30.4167);}}
function purchaseCalc(p,paid,at){

function assetCard(p,m){

function openForm(ent,id,pre){
  const E=ENT[ent],rec=id?db[ent].find(r=>r.id===id):Object.assign({},pre||{});if(id&&!rec)return;
  F={ent,id,pre:pre||{}};
  const def=(k)=>{if(rec[k]!==undefined)return rec[k];
    if(k==='date')return today();if(k==='status')return ent==='Milestones'?'Planned':(ent==='Projects'?'Planning':'Paid');
    if(k==='type')return 'personal';if(k==='kind')return ent==='Revenue'?'Revenue':'Consumable material';
    if(k==='recordedBy')return settings.actor||'';if(k==='growthComp')return 'monthly';if(k==='category'&&ent==='Ledger'&&P()&&P().type==='purchase')return 'Purchase payments';if(k==='delivery')return 'Delivered';if(k==='basis')return 'Daily';return '';};

    else if(t==='area'){h=`<textarea id="pjf-${k}">${esc(v)}</textarea>`;}
    else{h=`<input id="pjf-${k}" type="${t==='num'?'number':t==='date'?'date':'text'}"${t==='num'?' step="any" inputmode="decimal"':''} value="${esc(v)}">`;}
    return `<div class="pj-f ${t==='area'||t==='asset'||k==='description'||k==='notes'||k==='source'||k==='title'||k==='name'?'w':''}"><label>${l}${req?' *':''}</label>${h}</div>`;}).join('');
  $('pj-modal').innerHTML=`<div class="pj-ov"><div class="pj-mo"><div class="pj-mt">${id?'Edit':'Add'} ${E.n}</div><div class="pj-fg">${inputs}</div><div class="pj-err" id="pj-err"></div><div class="pj-mf"><button class="pj-b" onclick="PJ.closeForm()">Cancel</button><button class="pj-b pj-p" onclick="PJ.saveForm()">Save</button></div></div></div>`;
}
function closeForm(){F=null;const m=$('pj-modal');if(m)m.innerHTML='';}
function ledgerFor(link,pid){return db.Ledger.find(r=>r.linkedType===link.t&&r.linkedId===link.id&&r.projectId===pid);}
function saveForm(){
  if(!F)return;const E=ENT[F.ent],rec={};let bad='';
  E.f.forEach(([k,l,t,req])=>{const el=$('pjf-'+k);let v=el?el.value.trim():'';if(t==='num')v=v===''?'':num(v);if(req&&(v===''||v==null)&&!bad)bad=l+' is required';rec[k]=v;});
  if(bad){$('pj-err').textContent=bad;return;}
  if(F.ent==='Progress'&&(num(rec.pct)<0||num(rec.pct)>100)){$('pj-err').textContent='Progress must be between 0 and 100%';return;}
  const ent=F.ent,old=F.id?db[ent]&&db[ent].find(r=>r.id===F.id):null,pid=ent==='Projects'?(old?old.id:uid()):(V.id);
  if(ent==='LabourPay'){
    const w=db.Labour.find(r=>r.id===F.pre.workerId);
    db.Ledger.push({id:uid(),projectId:pid,date:rec.date,category:'Labour',description:'Payment — '+w.worker,amount:num(rec.amount),txCost:num(rec.txCost),supplier:w.worker,payMethod:rec.payMethod,status:'Paid',amountPaid:num(rec.amount),receiptUrl:rec.receiptUrl,recordedBy:settings.actor||'',linkedType:'labour',linkedId:w.id,createdAt:new Date().toISOString()});
    closeForm();commit('Paid labour',pid,w.worker+' '+kes(rec.amount));return;
  }
  if(ent==='Projects'){
    if(hooks.getAssets){const id=rec.linkedAsset;rec.linkedAssetId=id;rec.linkedAssetName=(hooks.getAssets().find(a=>a.id===id)||{}).name||'';}else{rec.linkedAssetName=rec.linkedAsset;rec.linkedAssetId=old?old.linkedAssetId||'':'';}
    delete rec.linkedAsset;
  }
  if((ent==='Ledger'||ent==='Materials')){
    const total=ent==='Ledger'?num(rec.amount):num(rec.qty)*num(rec.unitCost);
    if(rec.status==='Paid'&&!num(rec.amountPaid))rec.amountPaid=total;
    if(rec.status==='Partially Paid'&&!(num(rec.amountPaid)>0)){$('pj-err').textContent='Enter the amount paid so far';return;}
    if(num(rec.amountPaid)>total+0.5){$('pj-err').textContent='Amount paid cannot exceed the amount';return;}
    if(rec.status==='Pending Approval'||rec.status==='Approved'||rec.status==='Rejected'||rec.status==='Cancelled')rec.amountPaid=rec.status==='Approved'?num(rec.amountPaid):0;
  }
  const row=Object.assign({},old||{},rec,{id:old?old.id:uid(),createdAt:old?old.createdAt:new Date().toISOString()});
  if(ent!=='Projects')row.projectId=old?old.projectId:pid; else row.id=pid;
  if(ent==='Milestones'&&row.status==='Done'&&!row.completedDate)row.completedDate=today();
  if(ent==='Progress'&&F.pre&&F.pre.milestoneId&&!old){row.milestoneId=F.pre.milestoneId;const mm=db.Milestones.find(x=>x.id===row.milestoneId);if(mm&&mm.status==='Planned'&&num(row.pct)>0)mm.status='In progress';}
  if(old)db[ent][db[ent].indexOf(old)]=row;else db[ent].push(row);
  if(ent==='Materials'){ // mirror the purchase into the shared ledger
    const cat=row.kind==='Consumable material'?CATS[1]:CATS[2],tot=num(row.qty)*num(row.unitCost);
    let l=ledgerFor({t:'material',id:row.id},row.projectId);
    const data={date:row.date||today(),category:cat,description:row.item+(row.kind==='Rented equipment'?' (rental)':''),amount:tot,txCost:num(row.txCost),supplier:row.supplier,status:row.status,amountPaid:num(row.amountPaid),recordedBy:settings.actor||'',linkedType:'material',linkedId:row.id};
    if(l)Object.assign(l,data);else db.Ledger.push(Object.assign({id:uid(),projectId:row.projectId,createdAt:new Date().toISOString()},data));
  }
  closeForm();
  const nm={Projects:row.name,BudgetLines:row.category,Funding:row.source,Ledger:row.description,Labour:row.worker,Materials:row.item,Milestones:row.title,Documents:row.title,Revenue:row.description,Progress:pct(row.pct)};
  if(ent==='Projects'&&!old){V.name='project';V.id=row.id;V.tab='overview';}
  commit((old?'Edited ':'Added ')+E.n,row.projectId||row.id,nm[ent]||'');
}
let DEL=null;

  const p=db.Projects.find(x=>x.id===id);if(!p)return;DEL=id;

function del(ent,id){
  const r=db[ent].find(x=>x.id===id);if(!r)return;
  if(ent==='Projects'){delAsk(id);return;}   // deleting a whole project needs its name typed in
  if(!confirm('Delete this '+ENT[ent].n+'? This cannot be undone.'))return;
  db[ent]=db[ent].filter(x=>x.id!==id);

  commit('Deleted '+ENT[ent].n,r.projectId,r.title||r.item||r.worker||r.description||r.source||r.category||'');
}

/* ───────── handover: link to an existing plot or register standalone, with time-value-of-money valuation ───────── */
let HO=null;
function hoCalc(){
  if(!HO)return null;
  const as=hooks.getAssets?hooks.getAssets():[],a=as.find(x=>x.id===HO.assetId);
  if(HO.mode!=='link'||!a)return null;
  const yrs=a.date?Math.max((Date.now()-new Date(a.date+'T00:00:00'))/(365.25*86400000),0):0,r=num(HO.rate)/100;
  const fv=a.cost*Math.pow(1+r,yrs),base=HO.method==='B'?fv:a.value;
  return {a,yrs,fv,base,newMV:base+HO.cost,basis:a.cost+HO.cost};
}
function hoOpen(){
  const p=P();if(!p||p.handedOverAt||!hooks.createAsset)return;
  const m=metrics(p),cost=Math.round(m.paid+m.fees),as=hooks.getAssets?hooks.getAssets():[];
  const has=p.linkedAssetId&&as.find(a=>a.id===p.linkedAssetId);
  HO={mode:(has||as.length)?'link':'new',assetId:has?p.linkedAssetId:(as[0]?as[0].id:''),method:'A',rate:hooks.rate?hooks.rate():10,value:num(p.estimatedValue)||cost,cost};
  hoRender();
}
function hoSet(k,v){if(!HO)return;HO[k]=(k==='rate'||k==='value')?num(v):v;hoRender();}
function hoClose(){HO=null;const m=$('pj-modal');if(m)m.innerHTML='';}
function hoRender(){
  const p=P();if(!p||!HO)return;
  const as=hooks.getAssets?hooks.getAssets():[],c=hoCalc(),K=HO.cost,rowx=(l,v,b)=>`<div class="pj-row"><span class="${b?'':'pj-m'}">${b?'<b>'+l+'</b>':l}</span>${b?'<b>'+v+'</b>':v}</div>`;

       <label style="display:block;font-weight:400;margin:4px 0"><input type="radio" name="hom2" ${HO.method==='B'?'checked':''} onchange="PJ.hoSet('method','B')"> <b>B · Historical cost compounded</b> <span class="pj-m">— land purchase cost grown at a yearly rate over the years held + construction</span></label>
       ${HO.method==='B'?`<div style="margin-top:6px"><label>Yearly growth / inflation rate (%)</label><input type="number" step="any" value="${HO.rate}" onchange="PJ.hoSet('rate',this.value)" style="max-width:140px"> ${c.a.date?'':'<span class="pj-m">⚠ this plot has no acquisition date — years held counted as 0</span>'}</div>`:''}</div>
      <div class="pj-c" style="margin:12px 0 0;padding:12px"><div class="pj-ct" style="font-size:13px">1 · Market value update (net worth impact)</div>
       ${HO.method==='A'?rowx('Land current market value',kes(c.a.value)):rowx('Land cost '+kes(c.a.cost)+' compounded '+c.yrs.toFixed(1)+' yrs @ '+HO.rate+'%',kes(c.fv))}
       ${rowx('Value added by construction','+ '+kes(K))}${rowx('➜ New estimated market value',kes(c.newMV),1)}</div>
      <div class="pj-c" style="margin:10px 0 0;padding:12px"><div class="pj-ct" style="font-size:13px">2 · Tax cost basis (for KRA capital gains records)</div>

}

    const y=String(year||''),inY=d=>!y||String(d||'').slice(0,4)===y;
    const led=db.Ledger.filter(r=>r.status!=='Rejected'&&r.status!=='Cancelled'),fu=db.Funding;
    const fy=led.filter(r=>inY(r.date)).reduce((s,r)=>s+num(r.txCost),0)+fu.filter(r=>inY(r.date)).reduce((s,r)=>s+num(r.txCost),0);
    const my=led.filter(r=>inY(r.date)&&COUNTED.includes(r.status)).reduce((s,r)=>s+paidOf(r),0)+fu.filter(r=>inY(r.date)).reduce((s,r)=>s+num(r.transferred),0);
    const fa=led.reduce((s,r)=>s+num(r.txCost),0)+fu.reduce((s,r)=>s+num(r.txCost),0);
    return {fees:fy,moved:my,feesAll:fa};
  },
  matchBudget(){const p=P();if(!p)return;const t=rows('BudgetLines',p.id).reduce((s,r)=>s+num(r.planned),0);if(!t)return;p.approvedBudget=t;commit('Matched approved budget to budget lines',p.id,kes(t));},
  regAsset,pull,push,
  saveConn(){settings.url=$('pjs-url').value.trim();settings.token=$('pjs-token').value.trim();settings.actor=$('pjs-actor').value.trim();saveSettings();pull({force:false}).then(ok=>{if(ok)alert('Connected ✓');});},
  hasAssetHook(){return !!hooks.createAsset;},
  _db:()=>db,_metrics:metrics,_state:()=>({V,settings})
};
return api;
})();

PJ.mount(document.getElementById('pj-root'),{});
</script></body></html>
